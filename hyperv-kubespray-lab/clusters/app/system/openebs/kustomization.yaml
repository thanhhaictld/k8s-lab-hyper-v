apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openebs

resources:
  - storage-worker.yaml

helmCharts:
  - name: localpv-provisioner
    releaseName: openebs-localpv
    namespace: openebs
    version: 4.5.1
    repo: https://openebs.github.io/dynamic-localpv-provisioner
    valuesFile: values.yaml
